services:
  - type: web
    name: systemtask-backend
    env: node
    rootDir: Backend
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run db:migrate:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://mhenrique115.github.io
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
